name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,redis]"
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-gateway:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d -p 8080:8080 --name gw llm-gateway:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs -H "Authorization: Bearer sk-gw-local-dev" -H "content-type: application/json" \
            -d '{"model":"demo","messages":[{"role":"user","content":"hi"}]}' localhost:8080/v1/chat
