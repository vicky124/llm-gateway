services:
  gateway:
    build: .
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      GATEWAY_CONFIG: /app/config/gateway.yaml
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
